  </defs>
  <rect x="1" y="1" width="998" height="258" rx="18" fill="url(#bg)" stroke="#334155"/>
  <g transform="translate(75 60)">
    <g transform="translate(0 54)"><path d="M0 15L24 4L47 15L23 27Z" fill="url(#top)"/><path d="M0 15L23 27V57L0 45Z" fill="#164e63"/><path d="M23 27L47 15V45L23 57Z" fill="#312e81"/></g>
