    <g transform="translate(110 13)"><path d="M0 15L24 4L47 15L23 27Z" fill="url(#top)"/><path d="M0 15L23 27V98L0 86Z" fill="#164e63"/><path d="M23 27L47 15V86L23 98Z" fill="#312e81"/></g>
    <g transform="translate(165 45)"><path d="M0 15L24 4L47 15L23 27Z" fill="url(#top)"/><path d="M0 15L23 27V66L0 54Z" fill="#164e63"/><path d="M23 27L47 15V54L23 66Z" fill="#312e81"/></g>
